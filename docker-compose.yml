version: '3.8'

services:
  # Application server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookstudio:${VERSION:-latest}
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-bookstudio}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-bookstudio}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_VERIFIED_SENDER=${SENDGRID_VERIFIED_SENDER:-support@bookstud.io}
      - SESSION_SECRET=${SESSION_SECRET:-$(openssl rand -hex 32)}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - RUNNING_IN_DOCKER=true
      - SUPPORT_SITE_MANAGER_ROLE=true
      - TZ=America/Chicago
      - FACILITY_TIMEZONE=America/Chicago
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - file_uploads:/app/uploads
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Healthcheck to verify application is running properly
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Start the application after database initialization
    command: >
      sh -c "
        echo 'Starting application...' &&
        npm start
      "

  # Database initialization container
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookstudio:${VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-bookstudio}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-bookstudio}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_VERIFIED_SENDER=${SENDGRID_VERIFIED_SENDER:-support@bookstud.io}
      - SESSION_SECRET=${SESSION_SECRET:-$(openssl rand -hex 32)}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - RUNNING_IN_DOCKER=true
      - SUPPORT_SITE_MANAGER_ROLE=true
      - TZ=America/Chicago
      - FACILITY_TIMEZONE=America/Chicago
    networks:
      - app-network
    # Run database migrations and initialization
    command: >
      sh -c "
        echo 'Waiting for database to be fully ready...' &&
        sleep 10 &&
        echo 'Creating database schema...' &&
        node scripts/docker-migrate-db.cjs &&
        echo 'Creating PCR rooms schema...' &&
        node -e 'console.log(\"Creating PCR rooms table...\"); 
        const { Pool } = require(\"pg\"); 
        const pool = new Pool({ connectionString: process.env.DATABASE_URL });
        pool.query(`
          CREATE TABLE IF NOT EXISTS "pcr_rooms" (
            "id" SERIAL PRIMARY KEY,
            "name" TEXT NOT NULL UNIQUE,
            "description" TEXT,
            "status" TEXT NOT NULL DEFAULT '\''available'\''
          );
          ALTER TABLE "bookings"
          ADD COLUMN IF NOT EXISTS "pcr_room_id" INTEGER
          REFERENCES "pcr_rooms"("id") ON DELETE SET NULL;
          INSERT INTO "pcr_rooms" ("name", "description", "status")
          VALUES 
            ('\''PCR 1'\'', '\''Main Production Control Room'\'', '\''available'\''),
            ('\''PCR 2'\'', '\''Secondary Production Control Room'\'', '\''available'\''),
            ('\''PCR 3'\'', '\''Tertiary Production Control Room'\'', '\''available'\'')
          ON CONFLICT ("name") DO NOTHING;
        `, (err, res) => { 
          if (err) { console.error(err); process.exit(1); } 
          console.log(\"PCR rooms schema created successfully\"); 
          pool.end();
        });' &&
        echo 'Creating booking-studios junction table...' &&
        node -e 'console.log(\"Creating booking-studios junction table...\"); 
        const { Pool } = require(\"pg\"); 
        const pool = new Pool({ connectionString: process.env.DATABASE_URL });
        pool.query(`
          CREATE TABLE IF NOT EXISTS booking_studios (
            id SERIAL PRIMARY KEY,
            booking_id INTEGER NOT NULL,
            studio_id INTEGER NOT NULL,
            UNIQUE(booking_id, studio_id)
          );
          ALTER TABLE booking_studios 
          ADD CONSTRAINT IF NOT EXISTS fk_booking_id 
          FOREIGN KEY (booking_id) 
          REFERENCES bookings(id) 
          ON DELETE CASCADE;
          ALTER TABLE booking_studios 
          ADD CONSTRAINT IF NOT EXISTS fk_studio_id 
          FOREIGN KEY (studio_id) 
          REFERENCES studios(id) 
          ON DELETE CASCADE;
        `, (err, res) => { 
          if (err) { console.error(err); process.exit(1); } 
          console.log(\"Booking-studios junction table created successfully\"); 
          pool.end();
        });' &&
        echo 'Creating file attachments schema...' &&
        node -e 'console.log(\"Creating file_attachments table...\"); 
        const { Pool } = require(\"pg\"); 
        const pool = new Pool({ connectionString: process.env.DATABASE_URL });
        const fs = require(\"fs\");
        const path = require(\"path\");
        pool.query(`
          CREATE TABLE IF NOT EXISTS file_attachments (
            id SERIAL PRIMARY KEY,
            booking_id INTEGER NOT NULL REFERENCES bookings(id) ON DELETE CASCADE,
            file_name TEXT NOT NULL,
            file_size BIGINT NOT NULL,
            mime_type TEXT NOT NULL,
            path TEXT NOT NULL,
            uploaded_by INTEGER NOT NULL REFERENCES users(id),
            uploaded_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            description TEXT
          );
        `, (err, res) => { 
          if (err) { console.error(err); process.exit(1); } 
          console.log(\"File attachments table created successfully\");
          // Create directory for file uploads if it doesn't exist
          const uploadDir = path.resolve(\"/app/uploads\");
          if (!fs.existsSync(uploadDir)){
            console.log(\"Creating uploads directory...\");
            fs.mkdirSync(uploadDir, { recursive: true });
          }
          pool.end();
        });' &&
        echo 'Initializing database data with admin, site manager, producer, and engineer accounts...' &&
        node scripts/docker-init-db.cjs &&
        echo 'Database initialization completed successfully' 
      "

  # PostgreSQL database
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=${PGUSER:-postgres}
      - POSTGRES_PASSWORD=${PGPASSWORD:-postgres}
      - POSTGRES_DB=${PGDATABASE:-bookstudio}
      - TZ=America/Chicago
      - PGTZ=America/Chicago
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Enable this in production for database security
    # command: postgres -c config_file=/etc/postgresql/postgresql.conf
    # configs:
    #   - source: postgres_config
    #     target: /etc/postgresql/postgresql.conf

  # Nginx for production (enable in production)
  # web:
  #   image: nginx:alpine
  #   restart: always
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #     - ./ssl:/etc/nginx/ssl
  #     - file_uploads:/app/uploads
  #   networks:
  #     - app-network

# Network configuration
networks:
  app-network:
    driver: bridge

# Persistent volumes
volumes:
  postgres_data:
  file_uploads:

# Uncomment for production use
# configs:
#   postgres_config:
#     file: ./postgresql.conf