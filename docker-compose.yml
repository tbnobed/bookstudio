version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstuio-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bookstuio}
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-your_session_secret}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    # Mount the entire app directory for access to all files
    volumes:
      - ./:/app
    # Use a simple command to start the application
    command: node dist/server.js
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bookstuio-network

  db:
    image: postgres:15-alpine
    container_name: bookstuio-db
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-bookstuio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookstuio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bookstuio}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  # Dedicated initialization container that runs once and exits
  db-init:
    image: node:20-alpine
    container_name: bookstuio-db-init
    restart: "no"
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bookstuio}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookstuio-network
    command: >
      sh -c "apk add --no-cache postgresql-client &&
             echo 'Waiting for database to be fully ready...' &&
             sleep 5 &&
             echo 'Running database initialization...' &&
             cd /app &&
             node --experimental-specifier-resolution=node scripts/init-db.js &&
             node --experimental-specifier-resolution=node scripts/migrate-db.js &&
             echo 'Database initialization complete'"

networks:
  bookstuio-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local