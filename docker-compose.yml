services:
  app:
    build: .
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-bookstudio}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-bookstudio}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-placeholder_key}
      - SENDGRID_VERIFIED_SENDER=${SENDGRID_VERIFIED_SENDER:-alerts@obedtv.com}
      - SESSION_SECRET=${SESSION_SECRET:-$(openssl rand -hex 32)}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - RUNNING_IN_DOCKER=true
      - SUPPORT_SITE_MANAGER_ROLE=true
      # Updated UI version with PCR room display fix and chronological booking order
      - UI_VERSION=1.5.2
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - file_uploads:/app/uploads
    networks:
      - app-network
    # Start the application after database initialization
    command: >
      sh -c "
        echo 'Starting application with PCR room display fix and chronological booking order (v1.5.2)...' &&
        npm start
      "

  # Separate container for database initialization
  db-init:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-bookstudio}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-bookstudio}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-placeholder_key}
      - SENDGRID_VERIFIED_SENDER=${SENDGRID_VERIFIED_SENDER:-alerts@obedtv.com}
      - SESSION_SECRET=${SESSION_SECRET:-$(openssl rand -hex 32)}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - RUNNING_IN_DOCKER=true
      - SUPPORT_SITE_MANAGER_ROLE=true
    networks:
      - app-network
    # Run database migrations and initialization
    command: >
      sh -c "
        echo 'Waiting for database to be fully ready...' &&
        sleep 10 &&
        echo 'Creating database schema...' &&
        npx tsx scripts/migrate-db.ts &&
        echo 'Migrating file attachments schema...' &&
        npx tsx scripts/migrate-file-attachments.ts &&
        echo 'Migrating PCR rooms schema...' &&
        npx tsx scripts/migrate-pcr-rooms.ts &&
        echo 'Creating booking-studios junction table...' &&
        npx tsx scripts/create-booking-studios-table.ts &&
        echo 'Initializing database data with admin, site manager, producer, and engineer accounts...' &&
        npx tsx scripts/init-db.ts &&
        echo 'Database initialization completed successfully' 
      "

  db:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=${PGUSER:-postgres}
      - POSTGRES_PASSWORD=${PGPASSWORD:-postgres}
      - POSTGRES_DB=${PGDATABASE:-bookstudio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  file_uploads: