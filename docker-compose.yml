name: bookstudio

services:
  # PostgreSQL database service
  postgres:
    image: postgres:14-alpine
    container_name: bookstudio-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bookstudio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstudio-network

  # Database initialization service - using CommonJS
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstudio-db-init
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bookstudio}
      NODE_ENV: production
    command: node scripts/init-db-prod.js
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookstudio-network

  # Main application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstudio-app
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bookstudio}
      NODE_ENV: production
      PORT: 5000
      RUNNING_IN_DOCKER: "true"
      TZ: America/Chicago
      SESSION_SECRET: ${SESSION_SECRET:-your-secret-key-change-me}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_VERIFIED_SENDER: ${SENDGRID_VERIFIED_SENDER:-}
    ports:
      - "5000:5000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - bookstudio-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  uploads:
  logs:

networks:
  bookstudio-network:
    driver: bridge