version: '3.8'

services:
  # Application server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookstudio:${VERSION:-latest}
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    # Expose port 5000 for Nginx Proxy Manager to access
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-bookstudio}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-bookstudio}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_VERIFIED_SENDER=${SENDGRID_VERIFIED_SENDER:-support@bookstud.io}
      - SESSION_SECRET=${SESSION_SECRET:-$(openssl rand -hex 32)}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - RUNNING_IN_DOCKER=true
      - SUPPORT_SITE_MANAGER_ROLE=true
      - TZ=America/Chicago
      - FACILITY_TIMEZONE=America/Chicago
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - file_uploads:/app/uploads
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # Healthcheck to verify application is running properly
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    # Start the application after database initialization
    command: >
      sh -c "
        echo 'Starting BookStud.io application v1.4.1...' &&
        echo 'Using timezone: America/Chicago' &&
        echo 'Verifying database tables before startup...' &&
        node -e \"
          const { Pool } = require('pg');
          const pool = new Pool({
            host: process.env.PGHOST,
            port: process.env.PGPORT,
            database: process.env.PGDATABASE,
            user: process.env.PGUSER,
            password: process.env.PGPASSWORD
          });
          async function verifyTables() {
            try {
              // Check for system_settings table
              const result = await pool.query(\\\"
                SELECT EXISTS (
                  SELECT FROM information_schema.tables 
                  WHERE table_schema = 'public'
                  AND table_name = 'system_settings'
                );
              \\\");
              if (!result.rows[0].exists) {
                console.error('system_settings table not found. Running emergency fix...');
                await pool.query(\\\"
                  CREATE TABLE IF NOT EXISTS system_settings (
                    key TEXT PRIMARY KEY,
                    value TEXT NOT NULL,
                    description TEXT,
                    updated_at TIMESTAMPTZ DEFAULT NOW()
                  );
                \\\");
                await pool.query(\\\"
                  INSERT INTO system_settings (key, value, description)
                  VALUES ('siteName', 'The Plex Studios', 'The name of the facility displayed throughout the application')
                  ON CONFLICT (key) DO NOTHING;
                \\\");
                console.log('Emergency table creation complete');
              } else {
                console.log('Database tables verified successfully');
              }
            } catch (err) {
              console.error('Database verification failed:', err);
              process.exit(1);
            } finally {
              await pool.end();
            }
          }
          verifyTables();
        \" &&
        node dist/index.js
      "

  # Database initialization container
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookstudio:${VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-bookstudio}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-bookstudio}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_VERIFIED_SENDER=${SENDGRID_VERIFIED_SENDER:-support@bookstud.io}
      - SESSION_SECRET=${SESSION_SECRET:-$(openssl rand -hex 32)}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - RUNNING_IN_DOCKER=true
      - SUPPORT_SITE_MANAGER_ROLE=true
      - TZ=America/Chicago
      - FACILITY_TIMEZONE=America/Chicago
    networks:
      - app-network
    # Run database migrations and initialization
    command: >
      sh -c "
        echo 'Waiting for database to be fully ready...' &&
        sleep 10 &&
        echo 'Creating database schema...' &&
        node scripts/docker-migrate-db.cjs &&
        echo 'Creating PCR rooms schema...' &&
        node scripts/docker-migrate-pcr-rooms.cjs &&
        echo 'Creating booking-studios junction table...' &&
        node scripts/docker-create-booking-studios.cjs &&
        echo 'Creating file attachments schema...' &&
        node scripts/docker-migrate-file-attachments.cjs &&
        echo 'Adding booking colors support...' &&
        node scripts/docker-migrate-booking-colors.cjs &&
        echo 'Adding booking status support...' &&
        node scripts/docker-migrate-booking-status.cjs &&
        echo 'Setting up system settings table...' &&
        node scripts/docker-migrate-system-settings.cjs &&
        echo 'Setting up site manager notification system...' &&
        node scripts/docker-migrate-site-manager-notifications.cjs &&
        echo 'Initializing database data with admin, site manager, producer, and engineer accounts...' &&
        node scripts/docker-init-db.cjs &&
        echo 'Database initialization completed successfully' 
      "

  # PostgreSQL database
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=${PGUSER:-postgres}
      - POSTGRES_PASSWORD=${PGPASSWORD:-postgres}
      - POSTGRES_DB=${PGDATABASE:-bookstudio}
      - TZ=America/Chicago
      - PGTZ=America/Chicago
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Production-optimized Postgres settings
    command: postgres -c shared_buffers=256MB -c max_connections=100 -c timezone='America/Chicago' -c work_mem=4MB
    shm_size: '256mb'  # Shared memory size for PostgreSQL
    
  # No need for Nginx in Docker when using Nginx Proxy Manager externally

# Network configuration
networks:
  app-network:
    driver: bridge

# Persistent volumes
volumes:
  postgres_data:
    name: bookstudio_postgres_data
  file_uploads:
    name: bookstudio_file_uploads