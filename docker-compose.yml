version: '3.8'

services:
  # Application server
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        - VITE_OPENWEATHER_API_KEY=${VITE_OPENWEATHER_API_KEY}
        - VITE_WEATHER_LOCATION=${VITE_WEATHER_LOCATION}
        - VITE_WEATHER_LAT=${VITE_WEATHER_LAT}
        - VITE_WEATHER_LON=${VITE_WEATHER_LON}
        - VITE_FACILITY_TIMEZONE=${VITE_FACILITY_TIMEZONE:-America/Chicago}
        - TZ=${TZ:-America/Chicago}
    image: bookstudio:${VERSION:-latest}
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    # Expose port 5000 for Nginx Proxy Manager to access
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-bookstudio}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-bookstudio}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_VERIFIED_SENDER=${SENDGRID_VERIFIED_SENDER:-support@bookstud.io}
      - SESSION_SECRET=${SESSION_SECRET:-$(openssl rand -hex 32)}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - APP_DOMAIN=${APP_DOMAIN}
      - SITE_MANAGER_EMAIL=${SITE_MANAGER_EMAIL:-obedtest@tbn.tv}
      - RUNNING_IN_DOCKER=true
      - SUPPORT_SITE_MANAGER_ROLE=true
      - TZ=${TZ:-America/Chicago}
      - FACILITY_TIMEZONE=${FACILITY_TIMEZONE:-America/Chicago}
      - VITE_OPENWEATHER_API_KEY=${VITE_OPENWEATHER_API_KEY}
      - VITE_WEATHER_LOCATION=${VITE_WEATHER_LOCATION}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - file_uploads:/app/uploads
      - backups:/app/backups
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # Healthcheck to verify application is running properly
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:5000/api/health 2>/dev/null || curl -f http://localhost:5000/api/health || node -e 'const http = require(\"http\"); const req = http.get(\"http://localhost:5000/api/health\", res => process.exit(res.statusCode === 200 ? 0 : 1)); req.on(\"error\", () => process.exit(1)); req.setTimeout(3000, () => process.exit(1));'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    # Start the application after database initialization
    command: >
      sh -c "
        echo 'Starting BookStud.io application v1.5.5 with Asset Photos...' &&
        echo \"Using timezone: ${TZ:-America/Chicago}\" &&
        echo 'Verifying database tables before startup...' &&
        node -e \"
          const { Pool } = require('pg');
          const pool = new Pool({
            host: process.env.PGHOST,
            port: process.env.PGPORT,
            database: process.env.PGDATABASE,
            user: process.env.PGUSER,
            password: process.env.PGPASSWORD
          });
          async function verifyTables() {
            try {
              // Check for system_settings table
              const result = await pool.query('SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = \\'public\\' AND table_name = \\'system_settings\\');');
              if (!result.rows[0].exists) {
                console.error('system_settings table not found. Running emergency fix...');
                await pool.query('CREATE TABLE IF NOT EXISTS system_settings (id SERIAL PRIMARY KEY, key TEXT NOT NULL UNIQUE, value TEXT NOT NULL, created_at TIMESTAMPTZ DEFAULT NOW(), updated_at TIMESTAMPTZ DEFAULT NOW());');
                await pool.query('INSERT INTO system_settings (key, value, description) VALUES (\\'siteName\\', \\'The Plex Studios\\', \\'The name of the facility displayed throughout the application\\') ON CONFLICT (key) DO NOTHING;');
                console.log('Emergency table creation complete');
              } else {
                // Check if id column exists in system_settings
                const idColumnCheck = await pool.query('SELECT EXISTS (SELECT FROM information_schema.columns WHERE table_schema = \\'public\\' AND table_name = \\'system_settings\\' AND column_name = \\'id\\');');
                
                if (!idColumnCheck.rows[0].exists) {
                  console.error('system_settings table missing id column. Running emergency fix...');
                  try {
                    // Create backup
                    await pool.query('CREATE TABLE system_settings_backup AS SELECT * FROM system_settings;');
                    console.log('Created backup table: system_settings_backup');
                    
                    // Get primary key constraint name
                    const constraintQuery = await pool.query('SELECT constraint_name FROM information_schema.table_constraints WHERE table_schema = \\'public\\' AND table_name = \\'system_settings\\' AND constraint_type = \\'PRIMARY KEY\\';');
                    
                    if (constraintQuery.rows.length > 0) {
                      const pkConstraint = constraintQuery.rows[0].constraint_name;
                      // Drop the primary key constraint
                      await pool.query('ALTER TABLE system_settings DROP CONSTRAINT \\\"' + pkConstraint + '\\\";');
                      console.log('Dropped old primary key constraint');
                    }
                    
                    // Add id column
                    await pool.query('ALTER TABLE system_settings ADD COLUMN id SERIAL PRIMARY KEY;');
                    console.log('Added id column as PRIMARY KEY');
                    
                    // Add other timestamp columns if missing
                    const createdAtCheck = await pool.query('SELECT EXISTS (SELECT FROM information_schema.columns WHERE table_schema = \\'public\\' AND table_name = \\'system_settings\\' AND column_name = \\'created_at\\');');
                    if (!createdAtCheck.rows[0].exists) {
                      await pool.query('ALTER TABLE system_settings ADD COLUMN created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP;');
                      console.log('Added created_at column');
                    }
                    
                    const updatedAtCheck = await pool.query('SELECT EXISTS (SELECT FROM information_schema.columns WHERE table_schema = \\'public\\' AND table_name = \\'system_settings\\' AND column_name = \\'updated_at\\');');
                    if (!updatedAtCheck.rows[0].exists) {
                      await pool.query('ALTER TABLE system_settings ADD COLUMN updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP;');
                      console.log('Added updated_at column');
                    }
                    
                    // Ensure key is unique
                    await pool.query('ALTER TABLE system_settings ADD CONSTRAINT system_settings_key_unique UNIQUE (key);')
                      .catch(e => console.log('Note: key column unique constraint may already exist'));
                    
                    console.log('System settings table structure fixed successfully!');
                  } catch (error) {
                    console.error('Error fixing system_settings table:', error);
                  }
                } else {
                  console.log('Database tables verified successfully');
                }
              }
            } catch (err) {
              console.error('Database verification failed:', err);
              process.exit(1);
            } finally {
              await pool.end();
            }
          }
          verifyTables();
        \" &&
        node dist/index.js
      "

  # Database initialization container — reuses the image built by the app service
  db-init:
    image: bookstudio:${VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-bookstudio}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-bookstudio}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_VERIFIED_SENDER=${SENDGRID_VERIFIED_SENDER:-support@bookstud.io}
      - SESSION_SECRET=${SESSION_SECRET:-$(openssl rand -hex 32)}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - APP_DOMAIN=${APP_DOMAIN}
      - SITE_MANAGER_EMAIL=${SITE_MANAGER_EMAIL:-obedtest@tbn.tv}
      - RUNNING_IN_DOCKER=true
      - SUPPORT_SITE_MANAGER_ROLE=true
      - TZ=${TZ:-America/Chicago}
      - FACILITY_TIMEZONE=${FACILITY_TIMEZONE:-America/Chicago}
    networks:
      - app-network
    # Run consolidated database migration and initialization
    command: >
      sh -c "
        echo 'Waiting for database to be fully ready...' &&
        sleep 10 &&
        echo 'Running consolidated migration system...' &&
        node scripts/consolidated-migration.cjs &&
        echo 'Running schema repair (for existing deployments)...' &&
        node scripts/schema-repair.cjs &&
        echo 'Running Docker alerts column fix...' &&
        node scripts/docker-fix-alerts.cjs &&
        echo 'Running linked bookings migration (v1.5.0)...' &&
        node scripts/docker-migrate-linked-bookings.cjs &&
        echo 'Cleaning invalid notification references...' &&
        node scripts/clean-invalid-notifications.cjs &&
        echo 'Running production migration v1.5.1 (alert fixes)...' &&
        node scripts/production-migration-v1.5.1.cjs &&
        echo 'Running Docker audit schema fix (for v1.5.2 compatibility)...' &&
        node scripts/docker-audit-schema-fix.cjs &&
        echo 'Running production migration v1.5.2 (audit logging system)...' &&
        node scripts/production-migration-v1.5.2.cjs &&
        echo 'Running teams feature migration (v1.5.3)...' &&
        node scripts/docker-migrate-teams-v1.5.3.cjs &&
        echo 'Running teams schema audit fix (v1.5.3)...' &&
        node scripts/docker-audit-schema-fix-v1.5.3.cjs &&
        echo 'Running asset management migration (v1.5.4)...' &&
        node scripts/production-migration-v1.5.4.cjs &&
        echo 'Running asset photos migration (v1.5.5)...' &&
        node scripts/production-migration-v1.5.5.cjs &&
        echo 'Database initialization completed successfully!'
      "

  # PostgreSQL database
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=${PGUSER:-postgres}
      - POSTGRES_PASSWORD=${PGPASSWORD:-postgres}
      - POSTGRES_DB=${PGDATABASE:-bookstudio}
      - TZ=${TZ:-America/Chicago}
      - PGTZ=${TZ:-America/Chicago}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Production-optimized Postgres settings
    command: postgres -c shared_buffers=256MB -c max_connections=100 -c timezone='${TZ:-America/Chicago}' -c work_mem=4MB
    shm_size: '256mb'  # Shared memory size for PostgreSQL
    
  # No need for Nginx in Docker when using Nginx Proxy Manager externally

# Network configuration
networks:
  app-network:
    driver: bridge

# Persistent volumes
volumes:
  postgres_data:
    name: bookstudio_postgres_data
  file_uploads:
    name: bookstudio_file_uploads
  backups:
    name: bookstudio_backups