services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstuio-app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@db:5432/bookstudio
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - IS_DOCKER=true
    networks:
      - bookstuio-network
    healthcheck:
      test: ["CMD", "/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:15-alpine
    container_name: bookstuio-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bookstudio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookstuio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d bookstudio -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  bookstuio-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local