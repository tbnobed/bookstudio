version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstuio-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@db:5432/bookstuio
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-your_session_secret}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bookstuio
      - PGHOST=db
      - PGPORT=5432
    # Mount the entire app directory for access to all files
    volumes:
      - ./:/app
    # Use the enhanced entrypoint script for better error handling and more reliable startup
    command: sh -c "cd /app && bash docker-entrypoint.sh"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bookstuio-network

  db:
    image: postgres:15-alpine
    container_name: bookstuio-db
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bookstuio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookstuio-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      
  # Dedicated initialization container that runs once and exits
  db-init:
    image: node:20-alpine
    container_name: bookstuio-db-init
    restart: "no"
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@db:5432/bookstuio
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bookstuio
      - PGHOST=db
      - PGPORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookstuio-network
    command: >
      sh -c "apk add --no-cache postgresql-client &&
             echo 'Waiting for database to be fully ready...' &&
             until PGPASSWORD=postgres psql -h db -U postgres -d bookstuio -c '\q'; do
               echo 'PostgreSQL is unavailable - sleeping'
               sleep 1
             done &&
             echo 'PostgreSQL started' &&
             cd /app &&
             echo 'Running database schema creation...' &&
             npm run db:push &&
             echo 'Running database initialization and migration...' &&
             node --experimental-specifier-resolution=node scripts/init-db.js &&
             node --experimental-specifier-resolution=node scripts/migrate-db.js &&
             echo 'Database initialization complete'"

networks:
  bookstuio-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local