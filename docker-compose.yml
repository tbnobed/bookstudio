version: '3.8'

services:
  # Database service
  db:
    image: postgres:15-alpine
    container_name: bookstuio-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-bookstuio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookstuio-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Database initialization service - runs once and exits
  db-init:
    image: node:20-alpine
    container_name: bookstuio-db-init
    restart: "no"
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bookstuio}
      - PGHOST=db
      - PGUSER=${POSTGRES_USER:-postgres}
      - PGPASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PGDATABASE=${POSTGRES_DB:-bookstuio}
      - PGPORT=5432
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookstuio-network
    command: >
      sh -c "apk add --no-cache postgresql-client &&
             chmod +x /app/scripts/wait-for-db.sh &&
             /app/scripts/wait-for-db.sh &&
             cd /app &&
             npm run db:push &&
             node --experimental-specifier-resolution=node scripts/init-db.js &&
             echo 'Database initialization complete!'"

  # Main application service
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: bookstuio-app
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bookstuio}
      - PGHOST=db
      - PGUSER=${POSTGRES_USER:-postgres}
      - PGPASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PGDATABASE=${POSTGRES_DB:-bookstuio}
      - PGPORT=5432
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-changeme}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - HOST=0.0.0.0
      - PORT=3000
      - IS_DOCKER=true
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - bookstuio-network

networks:
  bookstuio-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local