<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favicon and Icon Generator</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .icon-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .icon-preview {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    canvas {
      margin: 10px;
      border: 1px dashed #ccc;
    }
    button {
      background: #0369a1;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #075985;
    }
  </style>
</head>
<body>
  <h1>Favicon and Apple Touch Icon Generator</h1>
  <p>This tool converts the SVG icons to PNG at various sizes for complete browser support.</p>
  
  <div class="icon-container">
    <div class="icon-preview">
      <h2>Favicon SVG</h2>
      <img src="/favicon.svg" alt="Favicon SVG" width="48">
    </div>
    <div class="icon-preview">
      <h2>Apple Touch Icon SVG</h2>
      <img src="/apple-touch-icon.svg" alt="Apple Touch Icon SVG" width="180">
    </div>
  </div>
  
  <h2>PNG Generation</h2>
  <p>Click the buttons below to generate and download the PNG versions of the icons:</p>
  
  <button onclick="generateFavicon(16)">Generate 16x16 favicon.ico</button>
  <button onclick="generateFavicon(32)">Generate 32x32 favicon.ico</button>
  <button onclick="generateFavicon(48)">Generate 48x48 favicon.png</button>
  <button onclick="generateTouchIcon(180)">Generate 180x180 apple-touch-icon.png</button>
  <button onclick="generateTouchIcon(192)">Generate 192x192 icon-192.png (Android)</button>
  <button onclick="generateTouchIcon(512)">Generate 512x512 icon-512.png (PWA)</button>
  
  <div id="canvas-container"></div>
  
  <script>
    async function loadSVG(url) {
      try {
        const response = await fetch(url);
        const svgText = await response.text();
        return svgText;
      } catch (error) {
        console.error('Error loading SVG:', error);
        return null;
      }
    }
    
    function svgToDataURL(svgText) {
      return 'data:image/svg+xml;base64,' + btoa(svgText);
    }
    
    function generateImage(svgText, size, outputId) {
      const canvasContainer = document.getElementById('canvas-container');
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      canvas.id = outputId;
      
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = function() {
        ctx.drawImage(img, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/png');
        
        // Create download link
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = outputId + '.png';
        link.textContent = 'Download ' + outputId + '.png';
        link.style.display = 'block';
        link.style.margin = '10px';
        
        canvasContainer.appendChild(canvas);
        canvasContainer.appendChild(link);
      };
      
      img.src = svgToDataURL(svgText);
    }
    
    async function generateFavicon(size) {
      const svgText = await loadSVG('/favicon.svg');
      if (svgText) {
        generateImage(svgText, size, 'favicon-' + size);
      }
    }
    
    async function generateTouchIcon(size) {
      const svgText = await loadSVG('/apple-touch-icon.svg');
      if (svgText) {
        generateImage(svgText, size, 'icon-' + size);
      }
    }
  </script>
</body>
</html>
