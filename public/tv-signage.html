<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Signage - TV Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1920px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #475569;
            padding-bottom: 20px;
        }
        
        .facility-name {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .current-time {
            font-size: 24px;
            color: #94a3b8;
        }
        
        .main-content {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        
        .left-section {
            display: table-cell;
            width: 70%;
            vertical-align: top;
            padding-right: 20px;
        }
        
        .right-section {
            display: table-cell;
            width: 30%;
            vertical-align: top;
        }
        
        .section-card {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            border: 1px solid #475569;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .section-header {
            background: rgba(51, 65, 85, 0.9);
            padding: 15px 20px;
            border-bottom: 1px solid #475569;
        }
        
        .section-title {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        
        .section-content {
            padding: 20px;
        }
        
        .bookings-grid {
            display: block;
        }
        
        .booking-row {
            display: table;
            width: 100%;
            margin-bottom: 15px;
            table-layout: fixed;
        }
        
        .booking-card {
            display: table-cell;
            width: 24%;
            margin-right: 1%;
            background: rgba(51, 65, 85, 0.6);
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            vertical-align: top;
        }
        
        .booking-card.alert {
            background: rgba(127, 29, 29, 0.6);
            border-left-color: #ef4444;
            animation: pulse 2s infinite;
        }
        
        .booking-card.active {
            background: rgba(21, 128, 61, 0.3);
            border-left-color: #22c55e;
        }
        
        .booking-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .booking-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .status-confirmed {
            background: #16a34a;
            color: white;
        }
        
        .status-tentative {
            background: #ca8a04;
            color: white;
        }
        
        .status-cancelled {
            background: #dc2626;
            color: white;
        }
        
        .booking-details {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        
        .live-indicator {
            display: inline-block;
            padding: 2px 6px;
            background: #dc2626;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        
        .weather-widget {
            text-align: center;
            padding: 20px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            border: 1px solid #475569;
            margin-bottom: 20px;
        }
        
        .weather-temp {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .weather-condition {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        
        .weather-details {
            font-size: 14px;
            color: #64748b;
        }
        
        .studio-grid {
            display: block;
        }
        
        .studio-row {
            display: table;
            width: 100%;
            margin-bottom: 10px;
            table-layout: fixed;
        }
        
        .studio-item {
            display: table-cell;
            width: 49%;
            margin-right: 2%;
            background: rgba(51, 65, 85, 0.4);
            border-radius: 8px;
            padding: 12px;
        }
        
        .studio-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .studio-status {
            font-size: 12px;
            color: #94a3b8;
        }
        
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-available {
            background: #22c55e;
        }
        
        .status-busy {
            background: #ef4444;
        }
        
        .auto-refresh {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 15px;
        }
        
        .refresh-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .error-message {
            text-align: center;
            color: #ef4444;
            padding: 20px;
            font-size: 18px;
        }
        
        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 40px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="facility-name" id="facilityName">Loading...</div>
            <div class="current-time" id="currentTime"></div>
        </div>
        
        <div class="main-content">
            <div class="left-section">
                <!-- Today's Bookings -->
                <div class="section-card">
                    <div class="section-header">
                        <div class="section-title">Today's Schedule</div>
                    </div>
                    <div class="section-content">
                        <div id="todaysBookings" class="loading">Loading today's bookings...</div>
                    </div>
                </div>
            </div>
            
            <div class="right-section">
                <!-- Weather Widget -->
                <div class="weather-widget" id="weatherWidget">
                    <div class="loading">Loading weather...</div>
                </div>
                
                <!-- Studio Status -->
                <div class="section-card">
                    <div class="section-header">
                        <div class="section-title">Studio Status</div>
                    </div>
                    <div class="section-content">
                        <div id="studioStatus" class="loading">Loading studios...</div>
                        <div class="auto-refresh">
                            <span class="refresh-dot"></span>
                            Auto-updating every 2 minutes
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        var currentData = {
            bookings: [],
            studios: [],
            bookingStudioLinks: [],
            siteName: '',
            weather: null
        };
        
        // Utility functions
        function formatTime(dateString) {
            var date = new Date(dateString);
            var hours = date.getHours();
            var minutes = date.getMinutes();
            var ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }
        
        function formatCurrentTime() {
            var now = new Date();
            var options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                timeZone: 'America/Chicago'
            };
            return now.toLocaleDateString('en-US', options);
        }
        
        function isBookingActive(booking) {
            var now = new Date();
            var start = new Date(booking.start);
            var end = new Date(booking.end);
            return now >= start && now <= end;
        }
        
        function isAlert(booking) {
            if (booking.type === 'maintenance') return true;
            if (!booking.title) return false;
            var title = booking.title.toLowerCase();
            return title.indexOf('alert') !== -1 || 
                   title.indexOf('outage') !== -1 || 
                   title.indexOf('emergency') !== -1 || 
                   title.indexOf('maintenance') !== -1 || 
                   title.indexOf('notice') !== -1 || 
                   title.indexOf('warning') !== -1;
        }
        
        function getStudioNames(booking) {
            var studioNames = [];
            var links = currentData.bookingStudioLinks.filter(function(link) {
                return link.bookingId === booking.id;
            });
            
            links.forEach(function(link) {
                var studio = currentData.studios.find(function(s) {
                    return s.id === link.studioId;
                });
                if (studio) {
                    studioNames.push(studio.name);
                }
            });
            
            return studioNames.join(', ') || 'No studio assigned';
        }
        
        // Update current time
        function updateCurrentTime() {
            document.getElementById('currentTime').textContent = formatCurrentTime();
        }
        
        // Fetch data from API
        function fetchData(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(null, data);
                        } catch (e) {
                            callback(e, null);
                        }
                    } else {
                        callback(new Error('HTTP ' + xhr.status), null);
                    }
                }
            };
            xhr.open('GET', url, true);
            xhr.send();
        }
        
        // Render today's bookings
        function renderTodaysBookings() {
            var container = document.getElementById('todaysBookings');
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            var todaysBookings = currentData.bookings.filter(function(booking) {
                var bookingDate = new Date(booking.start);
                return bookingDate >= today && bookingDate < tomorrow;
            });
            
            if (todaysBookings.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #64748b;"><div style="font-size: 18px;">No bookings scheduled for today</div></div>';
                return;
            }
            
            var html = '<div class="bookings-grid">';
            for (var i = 0; i < todaysBookings.length; i += 4) {
                html += '<div class="booking-row">';
                for (var j = 0; j < 4 && (i + j) < todaysBookings.length; j++) {
                    var booking = todaysBookings[i + j];
                    var isBookingAlert = isAlert(booking);
                    var isActive = isBookingActive(booking);
                    
                    var cardClass = 'booking-card';
                    if (isBookingAlert) cardClass += ' alert';
                    else if (isActive) cardClass += ' active';
                    
                    html += '<div class="' + cardClass + '" style="border-left-color: ' + booking.color + '">';
                    html += '<div class="booking-title">';
                    if (isBookingAlert) html += '⚠️ ';
                    html += booking.title;
                    if (isActive) html += ' <span class="live-indicator">LIVE</span>';
                    html += '</div>';
                    
                    var statusClass = 'booking-status status-' + booking.status;
                    html += '<div class="' + statusClass + '">' + booking.status.toUpperCase() + '</div>';
                    
                    html += '<div class="booking-details">' + getStudioNames(booking) + '</div>';
                    html += '<div class="booking-details">' + formatTime(booking.start) + ' - ' + formatTime(booking.end) + '</div>';
                    
                    if (booking.description) {
                        html += '<div class="booking-details" style="margin-top: 5px; font-size: 12px;">' + booking.description + '</div>';
                    }
                    
                    html += '</div>';
                }
                html += '</div>';
            }
            html += '</div>';
            
            container.innerHTML = html;
        }
        
        // Render studio status
        function renderStudioStatus() {
            var container = document.getElementById('studioStatus');
            
            if (currentData.studios.length === 0) {
                container.innerHTML = '<div class="error-message">No studios found</div>';
                return;
            }
            
            var html = '<div class="studio-grid">';
            for (var i = 0; i < currentData.studios.length; i += 2) {
                html += '<div class="studio-row">';
                for (var j = 0; j < 2 && (i + j) < currentData.studios.length; j++) {
                    var studio = currentData.studios[i + j];
                    
                    // Find current booking for this studio
                    var currentBooking = null;
                    var now = new Date();
                    
                    for (var k = 0; k < currentData.bookings.length; k++) {
                        var booking = currentData.bookings[k];
                        var start = new Date(booking.start);
                        var end = new Date(booking.end);
                        
                        if (now >= start && now <= end) {
                            var links = currentData.bookingStudioLinks.filter(function(link) {
                                return link.bookingId === booking.id && link.studioId === studio.id;
                            });
                            if (links.length > 0) {
                                currentBooking = booking;
                                break;
                            }
                        }
                    }
                    
                    var statusDot = currentBooking ? 'status-busy' : 'status-available';
                    
                    html += '<div class="studio-item">';
                    html += '<div class="studio-name"><span class="status-dot ' + statusDot + '"></span>' + studio.name + '</div>';
                    
                    if (currentBooking) {
                        html += '<div class="studio-status">' + currentBooking.title + '</div>';
                        html += '<div class="studio-status">Until ' + formatTime(currentBooking.end) + '</div>';
                    } else {
                        html += '<div class="studio-status" style="color: #22c55e;">Available</div>';
                    }
                    
                    html += '</div>';
                }
                html += '</div>';
            }
            html += '</div>';
            
            container.innerHTML = html;
        }
        
        // Load all data
        function loadData() {
            // Load site name
            fetchData('/api/system/site-name', function(err, data) {
                if (!err && data && data.siteName) {
                    currentData.siteName = data.siteName;
                    document.getElementById('facilityName').textContent = data.siteName;
                }
            });
            
            // Load bookings
            fetchData('/api/public/bookings', function(err, data) {
                if (!err && data) {
                    currentData.bookings = data;
                    renderTodaysBookings();
                }
            });
            
            // Load studios
            fetchData('/api/studios', function(err, data) {
                if (!err && data) {
                    currentData.studios = data;
                    renderStudioStatus();
                }
            });
            
            // Load booking-studio links
            fetchData('/api/public/booking-studios', function(err, data) {
                if (!err && data) {
                    currentData.bookingStudioLinks = data;
                    renderTodaysBookings();
                    renderStudioStatus();
                }
            });
        }
        
        // Initialize
        function init() {
            updateCurrentTime();
            loadData();
            
            // Update time every 30 seconds
            setInterval(updateCurrentTime, 30000);
            
            // Reload data every 2 minutes
            setInterval(loadData, 120000);
        }
        
        // Start when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
