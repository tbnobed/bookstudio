<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Signage - TV Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            padding: 20px;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1920px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #475569;
            padding-bottom: 20px;
        }
        
        .facility-name {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .current-time {
            font-size: 24px;
            color: #94a3b8;
        }
        
        .main-content {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        
        .left-section {
            display: table-cell;
            width: 70%;
            vertical-align: top;
            padding-right: 20px;
        }
        
        .right-section {
            display: table-cell;
            width: 30%;
            vertical-align: top;
        }
        
        .section-card {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            border: 1px solid #475569;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .section-header {
            background: rgba(51, 65, 85, 0.9);
            padding: 15px 20px;
            border-bottom: 1px solid #475569;
        }
        
        .section-title {
            font-size: 24px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
        }
        
        .section-title .icon {
            margin-right: 12px;
            font-size: 20px;
        }
        
        .section-content {
            padding: 20px;
        }
        
        .bookings-grid {
            display: block;
        }
        
        .booking-row {
            display: table;
            width: 100%;
            margin-bottom: 10px;
            table-layout: fixed;
        }
        
        .booking-card {
            display: table-cell;
            width: 24%;
            margin-right: 1%;
            background: rgba(51, 65, 85, 0.6);
            border-radius: 6px;
            border-left: 3px solid #3b82f6;
            padding: 8px;
            vertical-align: top;
        }
        
        .booking-card.alert {
            background: rgba(127, 29, 29, 0.6);
            border-left-color: #ef4444;
            animation: pulse 2s infinite;
        }
        
        .booking-card.active {
            background: rgba(21, 128, 61, 0.3);
            border-left-color: #22c55e;
        }
        
        .booking-title {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }
        
        .booking-status {
            display: inline-block;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 8px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .status-confirmed {
            background: #16a34a;
            color: white;
        }
        
        .status-tentative {
            background: #ca8a04;
            color: white;
        }
        
        .status-cancelled {
            background: #dc2626;
            color: white;
        }
        
        .booking-details {
            font-size: 9px;
            color: #94a3b8;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }
        
        .live-indicator {
            display: inline-block;
            padding: 1px 4px;
            background: #dc2626;
            color: white;
            border-radius: 4px;
            font-size: 8px;
            font-weight: bold;
            animation: pulse 1s infinite;
            margin-left: 4px;
        }
        
        /* Weekly Overview */
        .weekly-grid {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        
        .weekly-day {
            display: table-cell;
            width: 14.28%;
            padding: 10px;
            text-align: center;
            border-right: 1px solid #475569;
        }
        
        .weekly-day:last-child {
            border-right: none;
        }
        
        .day-header {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .day-number {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .today {
            color: #3b82f6;
        }
        
        .weather-forecast {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .weather-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 5px;
        }
        
        .weather-temp {
            font-size: 12px;
            color: #94a3b8;
        }
        
        .day-bookings {
            text-align: left;
        }
        
        .mini-booking {
            font-size: 10px;
            padding: 4px 6px;
            margin-bottom: 3px;
            border-radius: 4px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .mini-booking.alert {
            animation: pulse 2s infinite;
            border: 1px solid #ef4444;
        }
        
        .mini-booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        
        .mini-booking-title {
            font-weight: bold;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .mini-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-left: 4px;
            flex-shrink: 0;
        }
        
        .mini-booking-time {
            font-size: 9px;
            opacity: 0.9;
        }
        
        .mini-booking-studios {
            font-size: 9px;
            opacity: 0.7;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Studio Status */
        .studio-grid {
            display: block;
        }
        
        .studio-row {
            display: table;
            width: 100%;
            margin-bottom: 8px;
            table-layout: fixed;
        }
        
        .studio-item {
            display: table-cell;
            width: 49%;
            margin-right: 2%;
            background: rgba(51, 65, 85, 0.3);
            border-radius: 8px;
            padding: 8px;
        }
        
        .studio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .studio-name {
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .status-available {
            background: #22c55e;
        }
        
        .status-busy {
            background: #ef4444;
        }
        
        .studio-current {
            font-size: 10px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .studio-available {
            color: #22c55e;
        }
        
        .studio-until {
            font-size: 10px;
            color: #64748b;
            margin-top: 2px;
        }
        
        /* Active Site Alerts */
        .alert-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .alert-active {
            background: rgba(127, 29, 29, 0.6);
            border: 2px solid #ef4444;
            animation: pulse 2s infinite;
        }
        
        .alert-today {
            background: rgba(154, 52, 18, 0.5);
            border: 2px solid #ea580c;
        }
        
        .alert-upcoming {
            background: rgba(133, 77, 14, 0.4);
            border: 1px solid #ca8a04;
        }
        
        .alert-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .alert-icon {
            margin-right: 8px;
            font-size: 14px;
        }
        
        .alert-badge {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .alert-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #fef2f2;
        }
        
        .alert-time {
            font-size: 12px;
            margin-bottom: 4px;
        }
        
        .alert-studios {
            font-size: 12px;
        }
        
        .no-alerts {
            text-align: center;
            padding: 20px;
        }
        
        .no-alerts-text {
            color: #22c55e;
            font-size: 14px;
        }
        
        .no-alerts-sub {
            color: #64748b;
            font-size: 12px;
            margin-top: 4px;
        }
        
        .auto-refresh {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #475569;
        }
        
        .refresh-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .error-message {
            text-align: center;
            color: #ef4444;
            padding: 20px;
            font-size: 18px;
        }
        
        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 40px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="facility-name" id="facilityName">Loading...</div>
            <div class="current-time" id="currentTime"></div>
        </div>
        
        <div class="main-content">
            <div class="left-section">
                <!-- Today's Bookings -->
                <div class="section-card">
                    <div class="section-header">
                        <div class="section-title">
                            <span class="icon">📅</span>
                            Today's Schedule
                        </div>
                    </div>
                    <div class="section-content">
                        <div id="todaysBookings" class="loading">Loading today's bookings...</div>
                    </div>
                </div>
                
                <!-- Weekly Overview -->
                <div class="section-card">
                    <div class="section-header">
                        <div class="section-title">
                            <span class="icon">🕐</span>
                            Week at a Glance
                        </div>
                    </div>
                    <div class="section-content">
                        <div id="weeklyOverview" class="loading">Loading weekly overview...</div>
                    </div>
                </div>
            </div>
            
            <div class="right-section">
                <!-- Studio Status -->
                <div class="section-card">
                    <div class="section-header">
                        <div class="section-title">
                            <span class="icon">📡</span>
                            Studio Status
                        </div>
                    </div>
                    <div class="section-content">
                        <div id="studioStatus" class="loading">Loading studios...</div>
                        <div class="auto-refresh">
                            <span class="refresh-dot"></span>
                            Auto-updating every 2 minutes
                        </div>
                    </div>
                </div>
                
                <!-- Active Site Alerts -->
                <div class="section-card">
                    <div class="section-header">
                        <div class="section-title">
                            <span class="icon">⚠️</span>
                            Active Site Alerts
                        </div>
                    </div>
                    <div class="section-content">
                        <div id="siteAlerts" class="loading">Loading alerts...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        var currentData = {
            bookings: [],
            studios: [],
            bookingStudioLinks: [],
            siteName: '',
            weather: null,
            forecast: null
        };
        
        // Utility functions
        function formatTime(dateString) {
            var date = new Date(dateString);
            var hours = date.getHours();
            var minutes = date.getMinutes();
            var ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }
        
        function formatCurrentTime() {
            var now = new Date();
            var options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                timeZone: 'America/Chicago'
            };
            return now.toLocaleDateString('en-US', options);
        }
        
        function formatChicagoTime(dateString, format) {
            var date = new Date(dateString);
            var chicagoTime = new Date(date.toLocaleString("en-US", {timeZone: "America/Chicago"}));
            
            if (format === 'EEE') {
                var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                return days[chicagoTime.getDay()];
            } else if (format === 'd') {
                return chicagoTime.getDate().toString();
            } else if (format === 'h:mm a') {
                return formatTime(dateString);
            } else if (format === 'MMM d, h:mm a') {
                var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 
                             'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return months[chicagoTime.getMonth()] + ' ' + 
                       chicagoTime.getDate() + ', ' + formatTime(dateString);
            }
            return dateString;
        }
        
        function isBookingActive(booking) {
            var now = new Date();
            var start = new Date(booking.start);
            var end = new Date(booking.end);
            return now >= start && now <= end;
        }
        
        function isSameDay(date1, date2) {
            return date1.getFullYear() === date2.getFullYear() &&
                   date1.getMonth() === date2.getMonth() &&
                   date1.getDate() === date2.getDate();
        }
        
        function isAlert(booking) {
            if (booking.type === 'maintenance' || booking.type === 'all-day:maintenance' || booking.type === 'alert') return true;
            if (!booking.title) return false;
            var title = booking.title.toLowerCase();
            return title.indexOf('alert') !== -1 || 
                   title.indexOf('outage') !== -1 || 
                   title.indexOf('emergency') !== -1 || 
                   title.indexOf('maintenance') !== -1 || 
                   title.indexOf('notice') !== -1 || 
                   title.indexOf('warning') !== -1;
        }
        
        function getStudioNames(booking) {
            var studioNames = [];
            var links = currentData.bookingStudioLinks.filter(function(link) {
                return link.bookingId === booking.id;
            });
            
            links.forEach(function(link) {
                var studio = currentData.studios.find(function(s) {
                    return s.id === link.studioId;
                });
                if (studio) {
                    studioNames.push(studio.name);
                }
            });
            
            return studioNames.join(', ') || 'No studio assigned';
        }
        
        function getWeekDates() {
            var today = new Date();
            var startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - today.getDay());
            
            var dates = [];
            for (var i = 0; i < 7; i++) {
                var date = new Date(startOfWeek);
                date.setDate(startOfWeek.getDate() + i);
                dates.push(date);
            }
            return dates;
        }
        
        // Update current time
        function updateCurrentTime() {
            document.getElementById('currentTime').textContent = formatCurrentTime();
        }
        
        // Fetch data from API
        function fetchData(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(null, data);
                        } catch (e) {
                            callback(e, null);
                        }
                    } else {
                        callback(new Error('HTTP ' + xhr.status), null);
                    }
                }
            };
            xhr.open('GET', url, true);
            xhr.send();
        }
        
        // Render today's bookings
        function renderTodaysBookings() {
            var container = document.getElementById('todaysBookings');
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            var todaysBookings = currentData.bookings.filter(function(booking) {
                var bookingDate = new Date(booking.start);
                return bookingDate >= today && bookingDate < tomorrow;
            });
            
            if (todaysBookings.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #64748b;"><div style="font-size: 18px;">No bookings scheduled for today</div></div>';
                return;
            }
            
            var html = '<div class="bookings-grid">';
            for (var i = 0; i < todaysBookings.length; i += 4) {
                html += '<div class="booking-row">';
                for (var j = 0; j < 4 && (i + j) < todaysBookings.length; j++) {
                    var booking = todaysBookings[i + j];
                    var isBookingAlert = isAlert(booking);
                    var isActive = isBookingActive(booking);
                    
                    var cardClass = 'booking-card';
                    if (isBookingAlert) cardClass += ' alert';
                    else if (isActive) cardClass += ' active';
                    
                    html += '<div class="' + cardClass + '" style="border-left-color: ' + booking.color + '">';
                    html += '<div class="booking-title">';
                    if (isBookingAlert) html += '⚠️ ';
                    html += booking.title;
                    if (isActive) html += ' <span class="live-indicator">LIVE</span>';
                    html += '</div>';
                    
                    var statusClass = 'booking-status status-' + booking.status;
                    html += '<div class="' + statusClass + '">' + booking.status.toUpperCase() + '</div>';
                    
                    html += '<div class="booking-details">' + getStudioNames(booking) + '</div>';
                    html += '<div class="booking-details">' + formatTime(booking.start) + ' - ' + formatTime(booking.end) + '</div>';
                    
                    if (booking.description) {
                        html += '<div class="booking-details" style="margin-top: 5px; font-size: 12px;">' + booking.description + '</div>';
                    }
                    
                    html += '</div>';
                }
                html += '</div>';
            }
            html += '</div>';
            
            container.innerHTML = html;
        }
        
        // Render weekly overview
        function renderWeeklyOverview() {
            var container = document.getElementById('weeklyOverview');
            var weekDates = getWeekDates();
            var today = new Date();
            
            var html = '<div class="weekly-grid">';
            
            for (var i = 0; i < weekDates.length; i++) {
                var date = weekDates[i];
                var isToday = isSameDay(date, today);
                var dayClass = isToday ? 'today' : '';
                
                // Get bookings for this day
                var dayBookings = currentData.bookings.filter(function(booking) {
                    var bookingDate = new Date(booking.start);
                    return isSameDay(bookingDate, date);
                });
                
                html += '<div class="weekly-day">';
                html += '<div class="day-header ' + dayClass + '">' + formatChicagoTime(date.toISOString(), 'EEE') + '</div>';
                html += '<div class="day-number ' + dayClass + '">' + formatChicagoTime(date.toISOString(), 'd') + '</div>';
                
                // Weather forecast placeholder
                html += '<div class="weather-forecast">';
                html += '<div style="width: 32px; height: 32px; margin-bottom: 5px; display: flex; align-items: center; justify-content: center;">';
                html += '<span style="color: #64748b; font-size: 18px;">☁</span>';
                html += '</div>';
                html += '<div class="weather-temp">--/--</div>';
                html += '</div>';
                
                // Day bookings
                html += '<div class="day-bookings">';
                for (var j = 0; j < dayBookings.length; j++) {
                    var booking = dayBookings[j];
                    var isBookingAlert = isAlert(booking);
                    var alertClass = isBookingAlert ? ' alert' : '';
                    var bgColor = isBookingAlert ? 
                        (booking.severity === 'critical' ? '#dc2626' : '#ea580c') : 
                        booking.color;
                    
                    html += '<div class="mini-booking' + alertClass + '" style="background-color: ' + bgColor + '">';
                    html += '<div class="mini-booking-header">';
                    html += '<div class="mini-booking-title">';
                    if (isBookingAlert) html += '⚠️ ';
                    html += booking.title;
                    html += '</div>';
                    
                    // Status dot
                    var dotColor = '#22c55e';
                    if (booking.status === 'tentative') dotColor = '#eab308';
                    if (booking.status === 'cancelled') dotColor = '#ef4444';
                    html += '<div class="mini-status-dot" style="background-color: ' + dotColor + '"></div>';
                    html += '</div>';
                    
                    html += '<div class="mini-booking-time">' + 
                           formatChicagoTime(booking.start, 'h:mm a') + '-' + 
                           formatChicagoTime(booking.end, 'h:mm a') + '</div>';
                    
                    if (booking.type === 'maintenance') {
                        html += '<div style="background: rgba(234, 88, 12, 0.5); padding: 1px 3px; border-radius: 2px; font-size: 8px; margin-top: 2px; display: inline-block;">MAINT</div>';
                    }
                    
                    html += '<div class="mini-booking-studios">' + getStudioNames(booking) + '</div>';
                    html += '</div>';
                }
                html += '</div>';
                html += '</div>';
            }
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        // Render studio status
        function renderStudioStatus() {
            var container = document.getElementById('studioStatus');
            
            if (currentData.studios.length === 0) {
                container.innerHTML = '<div class="error-message">No studios found</div>';
                return;
            }
            
            var html = '<div class="studio-grid">';
            for (var i = 0; i < currentData.studios.length; i += 2) {
                html += '<div class="studio-row">';
                for (var j = 0; j < 2 && (i + j) < currentData.studios.length; j++) {
                    var studio = currentData.studios[i + j];
                    
                    // Find current booking for this studio
                    var currentBooking = null;
                    var now = new Date();
                    
                    for (var k = 0; k < currentData.bookings.length; k++) {
                        var booking = currentData.bookings[k];
                        var start = new Date(booking.start);
                        var end = new Date(booking.end);
                        
                        if (now >= start && now <= end) {
                            var links = currentData.bookingStudioLinks.filter(function(link) {
                                return link.bookingId === booking.id && link.studioId === studio.id;
                            });
                            if (links.length > 0) {
                                currentBooking = booking;
                                break;
                            }
                        }
                    }
                    
                    var statusDot = currentBooking ? 'status-busy' : 'status-available';
                    
                    html += '<div class="studio-item">';
                    html += '<div class="studio-header">';
                    html += '<div class="studio-name">' + studio.name + '</div>';
                    html += '<div class="status-dot ' + statusDot + '"></div>';
                    html += '</div>';
                    
                    if (currentBooking) {
                        html += '<div class="studio-current">' + currentBooking.title + '</div>';
                        html += '<div class="studio-until">Until ' + formatTime(currentBooking.end) + '</div>';
                    } else {
                        html += '<div class="studio-current studio-available">Available</div>';
                        html += '<div class="studio-until">Ready</div>';
                    }
                    
                    html += '</div>';
                }
                html += '</div>';
            }
            html += '</div>';
            
            container.innerHTML = html;
        }
        
        // Render site alerts
        function renderSiteAlerts() {
            var container = document.getElementById('siteAlerts');
            var today = new Date();
            var now = new Date();
            
            // Filter alerts and maintenance bookings
            var todaysAlerts = currentData.bookings.filter(function(booking) {
                var bookingDate = new Date(booking.start);
                return isSameDay(bookingDate, today) && isAlert(booking);
            });
            
            var maintenanceAlerts = currentData.bookings.filter(function(booking) {
                var bookingDate = new Date(booking.start);
                var sevenDaysFromNow = new Date(today);
                sevenDaysFromNow.setDate(today.getDate() + 7);
                return bookingDate > today && bookingDate <= sevenDaysFromNow && isAlert(booking);
            });
            
            var hasAlerts = todaysAlerts.length > 0 || maintenanceAlerts.length > 0;
            
            if (!hasAlerts) {
                container.innerHTML = '<div class="no-alerts">' +
                    '<div class="no-alerts-text">No Active Alerts</div>' +
                    '<div class="no-alerts-sub">All systems operational</div>' +
                    '</div>';
                return;
            }
            
            var html = '';
            
            // Active alerts (happening now)
            for (var i = 0; i < todaysAlerts.length; i++) {
                var alert = todaysAlerts[i];
                if (isBookingActive(alert)) {
                    html += '<div class="alert-item alert-active">';
                    html += '<div class="alert-header">';
                    html += '<div class="alert-icon">⚠️</div>';
                    html += '<div class="alert-badge" style="color: #fecaca;">ACTIVE ALERT</div>';
                    html += '</div>';
                    html += '<div class="alert-title">' + alert.title + '</div>';
                    html += '<div class="alert-time" style="color: #fecaca;">' + 
                           formatChicagoTime(alert.start, 'h:mm a') + ' - ' + 
                           formatChicagoTime(alert.end, 'h:mm a') + '</div>';
                    html += '<div class="alert-studios" style="color: #fed7d7;">' + getStudioNames(alert) + '</div>';
                    html += '</div>';
                }
            }
            
            // Today's upcoming alerts
            for (var i = 0; i < todaysAlerts.length; i++) {
                var alert = todaysAlerts[i];
                var alertStart = new Date(alert.start);
                if (!isBookingActive(alert) && alertStart > now) {
                    html += '<div class="alert-item alert-today">';
                    html += '<div class="alert-header">';
                    html += '<div class="alert-icon">⚠️</div>';
                    html += '<div class="alert-badge" style="color: #fed7aa;">TODAY</div>';
                    html += '</div>';
                    html += '<div class="alert-title" style="color: #fef2f2;">' + alert.title + '</div>';
                    html += '<div class="alert-time" style="color: #fed7aa;">' + 
                           formatChicagoTime(alert.start, 'h:mm a') + ' - ' + 
                           formatChicagoTime(alert.end, 'h:mm a') + '</div>';
                    html += '<div class="alert-studios" style="color: #fdba74;">' + getStudioNames(alert) + '</div>';
                    html += '</div>';
                }
            }
            
            // Upcoming maintenance (next 7 days, excluding today) - limit to 2
            var upcomingCount = 0;
            for (var i = 0; i < maintenanceAlerts.length && upcomingCount < 2; i++) {
                var alert = maintenanceAlerts[i];
                var alertDate = new Date(alert.start);
                if (!isSameDay(alertDate, today)) {
                    html += '<div class="alert-item alert-upcoming">';
                    html += '<div class="alert-header">';
                    html += '<div class="alert-icon">⚠️</div>';
                    html += '<div class="alert-badge" style="color: #fef3c7;">UPCOMING</div>';
                    html += '</div>';
                    html += '<div class="alert-title" style="color: #fefcf0;">' + alert.title + '</div>';
                    html += '<div class="alert-time" style="color: #fef3c7;">' + 
                           formatChicagoTime(alert.start, 'MMM d, h:mm a') + ' - ' + 
                           formatChicagoTime(alert.end, 'h:mm a') + '</div>';
                    html += '<div class="alert-studios" style="color: #fde68a;">' + getStudioNames(alert) + '</div>';
                    html += '</div>';
                    upcomingCount++;
                }
            }
            
            // Add auto-refresh indicator
            html += '<div class="auto-refresh">';
            html += '<div style="display: flex; align-items: center; justify-content: center; margin-bottom: 4px;">';
            html += '<span class="refresh-dot"></span>';
            html += '<span>Auto-updating every 2 minutes</span>';
            html += '</div>';
            html += '</div>';
            
            container.innerHTML = html;
        }
        
        // Load all data
        function loadData() {
            var dataLoadCount = 0;
            var totalDataSources = 4;
            
            function checkAndRenderAll() {
                dataLoadCount++;
                if (dataLoadCount >= totalDataSources) {
                    // All data loaded, render everything
                    renderTodaysBookings();
                    renderWeeklyOverview();
                    renderStudioStatus();
                    renderSiteAlerts();
                }
            }
            
            // Load site name
            fetchData('/api/system/site-name', function(err, data) {
                if (!err && data && data.siteName) {
                    currentData.siteName = data.siteName;
                    document.getElementById('facilityName').textContent = data.siteName;
                }
                checkAndRenderAll();
            });
            
            // Load bookings
            fetchData('/api/public/bookings', function(err, data) {
                if (!err && data) {
                    currentData.bookings = data;
                }
                checkAndRenderAll();
            });
            
            // Load studios
            fetchData('/api/studios', function(err, data) {
                if (!err && data) {
                    currentData.studios = data;
                }
                checkAndRenderAll();
            });
            
            // Load booking-studio links
            fetchData('/api/public/booking-studios', function(err, data) {
                if (!err && data) {
                    currentData.bookingStudioLinks = data;
                }
                checkAndRenderAll();
            });
        }
        
        // Initialize
        function init() {
            updateCurrentTime();
            loadData();
            
            // Update time every 30 seconds
            setInterval(updateCurrentTime, 30000);
            
            // Reload data every 2 minutes
            setInterval(loadData, 120000);
        }
        
        // Start when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
