version: '3.8'

networks:
  bookstuio-network:
    driver: bridge

services:
  db:
    image: postgres:14-alpine
    container_name: bookstuio-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-bookstuio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstuio-network

  # Test server container - a minimal container specifically for testing network connectivity
  test-server:
    image: node:16-alpine
    container_name: test-server
    working_dir: /app
    volumes:
      - ./test-server.js:/app/test-server.js
    ports:
      - "8080:8080"
    command: ["node", "test-server.js"]
    networks:
      - bookstuio-network

volumes:
  postgres_data: