# This file is a reference for Nginx Proxy Manager configuration
# When using Nginx Proxy Manager, you don't need to use this configuration directly
# Instead, configure your proxy hosts in the Nginx Proxy Manager UI

# Key configuration points to set in Nginx Proxy Manager:
# 1. Forward to: Your Docker host IP and port 5000
# 2. Enable WebSocket Support
# 3. Configure SSL with Let's Encrypt 
# 4. Set appropriate Cache Assets and Block Common Exploits options
# 5. Add custom nginx configuration if needed:

# Example of Custom Nginx Configuration for your proxy host:
# (Copy these into the "Custom Nginx Configuration" field in Advanced tab)

# Rate limiting for login
location /api/login {
    limit_req zone=login burst=5 nodelay;
}

# WebSocket support
location /ws {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}

# File uploads
location /api/upload {
    client_max_body_size 50M;
}

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()";