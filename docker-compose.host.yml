# Production Docker Compose configuration for BookStud.io with host networking
# With enhanced database migration reliability and improved connectivity

services:
  # Application server
  app:
    build:
      context: .
      dockerfile: Dockerfile.stable
    image: bookstudio:${VERSION:-latest}
    restart: always
    network_mode: host
    # When using host network, ports are directly exposed on the host
    # ports:
    #   - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@localhost:5432/${PGDATABASE:-bookstudio}
      - PGHOST=localhost
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-bookstudio}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_VERIFIED_SENDER=${SENDGRID_VERIFIED_SENDER:-support@bookstud.io}
      - SESSION_SECRET=${SESSION_SECRET:-$(openssl rand -hex 32)}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - RUNNING_IN_DOCKER=true
      - SUPPORT_SITE_MANAGER_ROLE=true
      - TZ=America/Chicago
      - FACILITY_TIMEZONE=America/Chicago
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - file_uploads:/app/uploads
    # Healthcheck to verify application is running properly
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    # Start the application after database initialization
    command: >
      sh -c "
        echo 'Starting BookStud.io application v1.4.1...' &&
        echo 'Using timezone: America/Chicago' &&
        echo 'Verifying database tables before startup...' &&
        node -e \"
          const { Pool } = require('pg');
          const pool = new Pool({
            host: process.env.PGHOST,
            port: process.env.PGPORT,
            database: process.env.PGDATABASE,
            user: process.env.PGUSER,
            password: process.env.PGPASSWORD
          });
          async function verifyTables() {
            try {
              // Check for system_settings table
              const checkSystemSettings = await pool.query('SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = \\'public\\' AND table_name = \\'system_settings\\');');
              if (!checkSystemSettings.rows[0].exists) {
                console.error('system_settings table not found. Running emergency fix...');
                await pool.query('CREATE TABLE IF NOT EXISTS system_settings (id SERIAL PRIMARY KEY, key TEXT NOT NULL UNIQUE, value TEXT NOT NULL, description TEXT, created_at TIMESTAMPTZ DEFAULT NOW(), updated_at TIMESTAMPTZ DEFAULT NOW());');
                await pool.query('INSERT INTO system_settings (key, value, description) VALUES (\\'siteName\\', \\'The Plex Studios\\', \\'The name of the facility displayed throughout the application\\') ON CONFLICT (key) DO NOTHING;');
                console.log('Emergency system_settings table created');
              }
              
              // Check for booking_studios table
              const checkBookingStudios = await pool.query('SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = \\'public\\' AND table_name = \\'booking_studios\\');');
              if (!checkBookingStudios.rows[0].exists) {
                console.error('booking_studios junction table not found. Please run full database migration.');
              }
              
              console.log('Database verification complete');
            } catch (err) {
              console.error('Database verification failed:', err);
              process.exit(1);
            } finally {
              await pool.end();
            }
          }
          verifyTables();
        \" &&
        echo 'Running last-minute fixes if needed...' &&
        node scripts/fix-system-settings.js &&
        node dist/index.js
      "

  # Database initialization container
  db-init:
    build:
      context: .
      dockerfile: Dockerfile.stable
    image: bookstudio:${VERSION:-latest}
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@localhost:5432/${PGDATABASE:-bookstudio}
      - PGHOST=localhost
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-bookstudio}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_VERIFIED_SENDER=${SENDGRID_VERIFIED_SENDER:-support@bookstud.io}
      - SESSION_SECRET=${SESSION_SECRET:-$(openssl rand -hex 32)}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - RUNNING_IN_DOCKER=true
      - SUPPORT_SITE_MANAGER_ROLE=true
      - TZ=America/Chicago
      - FACILITY_TIMEZONE=America/Chicago
    # Run database migrations and initialization with error handling
    command: >
      sh -c "
        echo 'Waiting for database to be fully ready...' &&
        sleep 10 &&
        
        echo '1. Running system_settings table fix first...' &&
        node scripts/fix-system-settings.js &&
        
        echo '2. Creating database schema...' &&
        node scripts/docker-migrate-db.cjs &&
        
        echo '3. Creating PCR rooms schema...' &&
        node scripts/docker-migrate-pcr-rooms.cjs &&
        
        echo '4. Creating booking-studios junction table...' &&
        node scripts/docker-create-booking-studios.cjs &&
        
        echo '5. Creating file attachments schema...' &&
        node scripts/docker-migrate-file-attachments.cjs &&
        
        echo '6. Adding booking colors support...' &&
        node scripts/docker-migrate-booking-colors.cjs &&
        
        echo '7. Adding booking status support...' &&
        node scripts/docker-migrate-booking-status.cjs &&
        
        echo '8. Setting up system settings table...' &&
        node scripts/docker-fix-system-settings.cjs &&
        node scripts/docker-migrate-system-settings.cjs || echo 'System settings migration skipped, using the fix script only' &&
        
        echo '9. Setting up site manager notification system...' &&
        node scripts/docker-migrate-site-manager-notifications.cjs &&
        
        echo '10. Initializing database with admin and other accounts...' &&
        node scripts/docker-init-db.cjs &&
        
        echo '11. Running comprehensive database fix script...' &&
        node scripts/fix-db-all.js &&
        
        echo 'Database initialization completed successfully' 
      "

  # PostgreSQL database
  db:
    image: postgres:14-alpine
    restart: always
    network_mode: host
    environment:
      - POSTGRES_USER=${PGUSER:-postgres}
      - POSTGRES_PASSWORD=${PGPASSWORD:-postgres}
      - POSTGRES_DB=${PGDATABASE:-bookstudio}
      - TZ=America/Chicago
      - PGTZ=America/Chicago
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Production-optimized Postgres settings
    command: postgres -c shared_buffers=256MB -c max_connections=100 -c timezone='America/Chicago' -c work_mem=4MB
    shm_size: '256mb'  # Shared memory size for PostgreSQL

# Persistent volumes
volumes:
  postgres_data:
    name: bookstudio_postgres_data
  file_uploads:
    name: bookstudio_file_uploads