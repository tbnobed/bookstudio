version: '3.8'

# This file automatically loads .env files for Docker Compose
# It extends the main docker-compose.yml with development-friendly settings

services:
  app:
    # Ensure all environment variables from .env are loaded
    env_file:
      - .env
    # Additional environment variables for weather integration
    environment:
      - VITE_OPENWEATHER_API_KEY=${VITE_OPENWEATHER_API_KEY}
      - VITE_WEATHER_LOCATION=${VITE_WEATHER_LOCATION:-Dallas,TX,US}
      - VITE_WEATHER_LAT=${VITE_WEATHER_LAT}
      - VITE_WEATHER_LON=${VITE_WEATHER_LON}